services:
  db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - products_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U products -d products"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  products_data:
