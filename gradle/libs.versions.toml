[versions]
agp = "9.0.1"
kotlin = "2.2.10"
composeBom = "2025.10.01"
activity = "1.11.0"
lifecycle = "2.9.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
scanner = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
material3 = { module = "androidx.compose.material3:material3" }
preview = { module = "androidx.compose.ui:ui-tooling-preview" }
tooling = { module = "androidx.compose.ui:ui-tooling" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
ui-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16.1" }
